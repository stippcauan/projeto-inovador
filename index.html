<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapeador Colaborativo de Acessibilidade</title>
    <style>
        :root {
            --primaria: #0f4c81;
            --primaria-escura: #093154;
            --fundo: #f4f7fa;
            --cartao: #ffffff;
            --texto: #1e293b;
            --borda: #cbd5e1;
            --destaque: #e0f2fe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--fundo);
            color: var(--texto);
            line-height: 1.6;
        }

        header {
            background-color: var(--primaria);
            color: #ffffff;
            padding: 2rem 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.4rem;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        main {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .painel {
            background: var(--cartao);
            padding: 1.5rem;
            border-radius: 10px;
            border: 1px solid var(--borda);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: var(--primaria);
            border-bottom: 2px solid var(--destaque);
            padding-bottom: 0.5rem;
        }

        .campo {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 0.65rem;
            border: 1px solid var(--borda);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        input:focus, select:focus, textarea:focus, button:focus {
            outline: 3px solid #38bdf8;
            outline-offset: 2px;
        }

        .grupo-checkbox {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.3rem;
        }

        .grupo-checkbox label {
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
        }

        button {
            width: 100%;
            background-color: var(--primaria);
            color: #ffffff;
            border: none;
            padding: 0.8rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primaria-escura);
        }

        .filtros {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.2rem;
        }

        .card-local {
            border: 1px solid var(--borda);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            background: #ffffff;
        }

        .card-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .card-topo h3 {
            font-size: 1.1rem;
            color: var(--primaria-escura);
        }

        .categoria {
            font-size: 0.8rem;
            background: #e2e8f0;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-weight: 600;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin: 0.6rem 0;
        }

        .tag {
            background-color: var(--destaque);
            color: var(--primaria-escura);
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
        }

        .descricao {
            font-size: 0.92rem;
            color: #475569;
        }
    </style>
</head>
<body>

<header>
    <h1>Mapeador Colaborativo de Acessibilidade</h1>
    <p>Cadastre e consulte espaços públicos e privados com infraestrutura acessível</p>
</header>

<main>
    <section class="painel" aria-labelledby="titulo-cadastro">
        <h2 id="titulo-cadastro">Cadastrar Novo Local</h2>
        <form id="form-local">
            <div class="campo">
                <label for="nome">Nome do Estabelecimento ou Local</label>
                <input type="text" id="nome" name="nome" required placeholder="Ex: Estação Central, Café Cultura...">
            </div>

            <div class="campo">
                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria">
                    <option value="Comércio e Alimentação">Comércio e Alimentação</option>
                    <option value="Educação e Cultura">Educação e Cultura</option>
                    <option value="Saúde">Saúde</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Lazer">Lazer</option>
                </select>
            </div>

            <div class="campo">
                <label>Recursos de Acessibilidade Disponíveis</label>
                <div class="grupo-checkbox">
                    <label><input type="checkbox" value="Rampa de Acesso"> Rampa de Acesso</label>
                    <label><input type="checkbox" value="Banheiro Adaptado"> Banheiro Adaptado</label>
                    <label><input type="checkbox" value="Piso Tátil"> Piso Tátil</label>
                    <label><input type="checkbox" value="Intérprete de Libras"> Intérprete de Libras</label>
                    <label><input type="checkbox" value="Elevador"> Elevador</label>
                    <label><input type="checkbox" value="Vaga PCD"> Vaga PCD</label>
                </div>
            </div>

            <div class="campo">
                <label for="descricao">Detalhes e Observações</label>
                <textarea id="descricao" name="descricao" rows="3" placeholder="Descreva condições da entrada, largura de corredores, atendimento..."></textarea>
            </div>

            <button type="submit">Adicionar ao Mapa</button>
        </form>
    </section>

    <section class="painel" aria-labelledby="titulo-lista">
        <h2 id="titulo-lista">Locais Mapeados</h2>
        <div class="filtros">
            <input type="text" id="busca" placeholder="Buscar por nome ou recurso..." aria-label="Buscar locais">
        </div>
        <div id="lista-locais" aria-live="polite">
            <p>Carregando locais...</p>
        </div>
    </section>
</main>

<script>
    let todosLocais = [];

    async function carregarLocais() {
        try {
            const resposta = await fetch('/api/locais');
            todosLocais = await resposta.json();
            renderizarLocais(todosLocais);
        } catch (erro) {
            document.getElementById('lista-locais').innerHTML =
                '<p>Não foi possível conectar ao servidor Java. Verifique se o programa está rodando.</p>';
        }
    }

    function renderizarLocais(lista) {
        const container = document.getElementById('lista-locais');
        if (lista.length === 0) {
            container.innerHTML = '<p>Nenhum local encontrado com esse filtro.</p>';
            return;
        }

        container.innerHTML = lista.map(local => {
            const tagsHtml = local.recursos
                .split(',')
                .map(r => `<span class="tag">${r.trim()}</span>`)
                .join('');

            return `
                <article class="card-local">
                    <div class="card-topo">
                        <h3>${local.nome}</h3>
                        <span class="categoria">${local.categoria}</span>
                    </div>
                    <div class="tags">${tagsHtml}</div>
                    <p class="descricao">${local.descricao || 'Sem observações adicionais.'}</p>
                </article>
            `;
        }).join('');
    }

    document.getElementById('form-local').addEventListener('submit', async (e) => {
        e.preventDefault();

        const nome = document.getElementById('nome').value.trim();
        const categoria = document.getElementById('categoria').value;
        const descricao = document.getElementById('descricao').value.trim();

        const checkboxes = document.querySelectorAll('.grupo-checkbox input:checked');
        const recursosSelecionados = Array.from(checkboxes).map(cb => cb.value);
        const recursos = recursosSelecionados.length > 0
            ? recursosSelecionados.join(', ')
            : 'Acessibilidade básica';

        const dados = new URLSearchParams({ nome, categoria, recursos, descricao });

        await fetch('/api/locais', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: dados
        });

        e.target.reset();
        carregarLocais();
    });

    document.getElementById('busca').addEventListener('input', (e) => {
        const termo = e.target.value.toLowerCase();
        const filtrados = todosLocais.filter(l =>
            l.nome.toLowerCase().includes(termo) ||
            l.recursos.toLowerCase().includes(termo) ||
            l.categoria.toLowerCase().includes(termo)
        );
        renderizarLocais(filtrados);
    });

    carregarLocais();
</script>

</body>
</html>
